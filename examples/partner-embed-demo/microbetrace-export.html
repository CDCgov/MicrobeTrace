  <title>Continue to MicrobeTrace</title>
  <style>
    body { color: #172033; font: 16px/1.5 system-ui, sans-serif; margin: 0; }

    button { background: #245f9d; border: 0; border-radius: 6px; color: white; cursor: pointer; font: inherit; font-weight: 700; padding: 11px 16px; }

  <main>
    <h1>Continue to MicrobeTrace</h1>

      <p>Isolation: <code id="isolation-state"></code></p>
      <p id="summary">Reading the staged export…</p>
      <button id="continue" type="button" disabled>Continue to MicrobeTrace</button>
      <p id="status" role="status"></p>
    </section>
  </main>
